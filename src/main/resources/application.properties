spring.application.name=nowstation-server
# 키는 프로젝트 루트의 .env(git 제외)에서 읽는다. 배포 환경에서는 환경 변수로 넣는다.
spring.config.import=optional:file:.env[.properties]
seoul.subway.api-key=${SEOUL_SUBWAY_KEY:}
seoul.subway.base-url=http://swopenapi.seoul.go.kr/api/subway

# 테이블은 Flyway 마이그레이션이 만들고, JPA는 맞는지 확인만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 탑승 중인 사람이 있을 때만, 그 노선만 이 간격으로 받는다(하루 1,000건 한도)
ride.poll-interval=PT15S
# 앱(5초마다 조회)이 이만큼 소식이 없으면 탑승을 끝낸다(강제 종료·폰 꺼짐 → 남은 탑승이 한도를 쓰지 않게)
ride.idle-timeout=PT10M
# 탑승 기록 보관 기간(개인정보처리방침과 맞출 것). 매일 04:30 KST에 지난 것을 지운다
ride.record-retention=P90D
# 지금 돌고 있는 버전(커밋 번호). 이미지 만들 때 APP_VERSION으로 넣고, 자동 배포가 /actuator/info로 적용됐는지 확인한다
info.app.version=${APP_VERSION:dev}
management.endpoints.web.exposure.include=health,info
