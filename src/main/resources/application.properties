spring.application.name=nowstation-server
# 키는 프로젝트 루트의 .env(git 제외)에서 읽는다. 배포 환경에서는 환경 변수로 넣는다.
spring.config.import=optional:file:.env[.properties]
seoul.subway.api-key=${SEOUL_SUBWAY_KEY:}
seoul.subway.base-url=http://swopenapi.seoul.go.kr/api/subway

# 테이블은 Flyway 마이그레이션이 만들고, JPA는 맞는지 확인만 한다
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# 탑승 중인 사람이 있을 때만, 그 노선만 이 간격으로 받는다(하루 1,000건 한도)
ride.poll-interval=PT15S
